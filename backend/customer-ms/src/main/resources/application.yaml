server:
  servlet:
    context-path: /customer-app
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres-delivery:5432/customer_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    fail-on-missing-locations: true



